services:
  mysql:
    image: mysql:8.4
    container_name: cq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-content_quality}
      MYSQL_USER: ${MYSQL_USER:-trustops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trustops}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    container_name: cq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cq-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-trustops}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-trustops}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  gateway:
    build:
      context: ./services/gateway-go
    container_name: cq-gateway
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: "${GATEWAY_ADDR:-:8080}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-mysql}"
      MYSQL_DSN: "${MYSQL_DSN:-trustops:trustops@tcp(mysql:3306)/content_quality?parseTime=true}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://trustops:trustops@rabbitmq:5672/}"
      RABBITMQ_QUEUE: "${RABBITMQ_QUEUE:-content.events.ingest}"
      CASE_CACHE_TTL_SECONDS: "${CASE_CACHE_TTL_SECONDS:-300}"
      OUTBOX_POLL_INTERVAL_SECONDS: "${OUTBOX_POLL_INTERVAL_SECONDS:-2}"
      OUTBOX_BATCH_SIZE: "${OUTBOX_BATCH_SIZE:-50}"
      OUTBOX_MAX_ATTEMPTS: "${OUTBOX_MAX_ATTEMPTS:-3}"
      OUTBOX_RETRY_BASE_SECONDS: "${OUTBOX_RETRY_BASE_SECONDS:-2}"
      GATEWAY_API_KEYS: "${GATEWAY_API_KEYS:-content-dev-key}"
      GATEWAY_RATE_LIMIT_PER_MINUTE: "${GATEWAY_RATE_LIMIT_PER_MINUTE:-60}"
      GATEWAY_RATE_LIMIT_PREFIX: "${GATEWAY_RATE_LIMIT_PREFIX:-cq}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      copilot:
        condition: service_started
    ports:
      - "8080:8080"

  copilot:
    build:
      context: ./services/ai-copilot
    container_name: cq-copilot
    restart: unless-stopped
    ports:
      - "8090:8090"

  worker:
    build:
      context: ./services/worker
    container_name: cq-worker
    restart: unless-stopped
    environment:
      WORKER_RABBITMQ_URL: "${WORKER_RABBITMQ_URL:-amqp://trustops:trustops@rabbitmq:5672/}"
      WORKER_QUEUE: "${WORKER_QUEUE:-content.events.ingest}"
      WORKER_CONSUMER_TAG: "${WORKER_CONSUMER_TAG:-content-quality-worker}"
      WORKER_STORAGE_BACKEND: "${WORKER_STORAGE_BACKEND:-mysql}"
      WORKER_MYSQL_DSN: "${WORKER_MYSQL_DSN:-trustops:trustops@tcp(mysql:3306)/content_quality?parseTime=true}"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  mysql_data:
