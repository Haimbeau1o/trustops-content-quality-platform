services:
  mysql:
    image: mysql:8.4
    container_name: cq-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-content_quality}
      MYSQL_USER: ${MYSQL_USER:-trustops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-trustops}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.4-alpine
    container_name: cq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: cq-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"

  gateway:
    build:
      context: ./services/gateway-go
    container_name: cq-gateway
    restart: unless-stopped
    environment:
      GATEWAY_ADDR: "${GATEWAY_ADDR:-:8080}"
      STORAGE_BACKEND: "${STORAGE_BACKEND:-auto}"
      MYSQL_DSN: "${MYSQL_DSN:-trustops:trustops@tcp(mysql:3306)/content_quality?parseTime=true}"
      REDIS_ADDR: "${REDIS_ADDR:-redis:6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
      REDIS_DB: "${REDIS_DB:-0}"
      RABBITMQ_URL: "${RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}"
      RABBITMQ_QUEUE: "${RABBITMQ_QUEUE:-content.events.ingest}"
      CASE_CACHE_TTL_SECONDS: "${CASE_CACHE_TTL_SECONDS:-300}"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - copilot
    ports:
      - "8080:8080"

  copilot:
    build:
      context: ./services/ai-copilot
    container_name: cq-copilot
    restart: unless-stopped
    ports:
      - "8090:8090"

  worker:
    build:
      context: ./services/worker
    container_name: cq-worker
    restart: unless-stopped
    environment:
      WORKER_RABBITMQ_URL: "${WORKER_RABBITMQ_URL:-amqp://guest:guest@rabbitmq:5672/}"
      WORKER_QUEUE: "${WORKER_QUEUE:-content.events.ingest}"
      WORKER_CONSUMER_TAG: "${WORKER_CONSUMER_TAG:-content-quality-worker}"
    depends_on:
      - rabbitmq

volumes:
  mysql_data:
